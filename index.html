<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mick's Game Portal</title>
    <style>
        * {
            touch-action: none;
        }
        
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            position: relative;
            border: 2px solid #333;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 70%, #90EE90 70%, #90EE90 100%);
            overflow: hidden;
            max-width: 100%;
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
        }
        
        /* Mobile Controls */
        #mobileControls {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            z-index: 100;
        }
        
        .control-side {
            position: absolute;
            bottom: 0;
            width: 50%;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .control-left {
            left: 0;
            background: rgba(0, 100, 200, 0.15);
            display: flex;
            gap: 10px;
            flex-direction: row;
        }
        
        .control-right {
            right: 0;
            background: rgba(200, 0, 0, 0.15);
            display: flex;
            gap: 10px;
            flex-direction: column;
        }
        
        .control-btn {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            background: rgba(100, 150, 255, 0.4);
            color: white;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .control-btn:active {
            background: rgba(100, 150, 255, 0.8);
            transform: scale(0.95);
        }
        
        .control-right .control-btn {
            background: rgba(255, 100, 100, 0.4);
        }
        
        .control-right .control-btn:active {
            background: rgba(255, 100, 100, 0.8);
        }
        
        /* Desktop only */
        @media (min-width: 769px) {
            #mobileControls {
                display: none !important;
            }
        }
        
        /* Mobile only */
        @media (max-width: 768px) {
            #mobileControls {
                display: flex;
            }
            
            body {
                padding: 10px;
            }
            
            #gameContainer {
                max-width: 100vw;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="mobileControls">
            <div class="control-side control-left">
                <button class="control-btn" id="btnLeft">◀</button>
                <button class="control-btn" id="btnRight">▶</button>
            </div>
            <div class="control-side control-right">
                <button class="control-btn" id="btnJump">↑ JUMP</button>
                <button class="control-btn" id="btnAction">⚡ ACT</button>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
