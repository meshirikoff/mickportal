<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mick's Game">
    <meta name="theme-color" content="#87CEEB">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%2387CEEB' width='192' height='192'/><rect fill='%23FF0000' x='60' y='60' width='72' height='72'/></svg>">
    <title>Mick's Game Portal</title>
    <style>
        * {
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            width: 100vw;
            height: 100vh;
            min-height: 100vh;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        
        #gameContainer {
            position: relative;
            border: 2px solid #333;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 70%, #90EE90 70%, #90EE90 100%);
            overflow: hidden;
            aspect-ratio: 1200 / 600;
            width: 100vw;
            max-width: 100vw;
            height: auto;
            max-height: 80vh;
            flex-shrink: 1;
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
        }
        
        /* Mobile Controls */
        #mobileControls {
            display: flex;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15vh;
            z-index: 100;
        }
        
        .control-side {
            position: absolute;
            bottom: 0;
            width: 50%;
            height: 15vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .control-left {
            left: 0;
            background: rgba(0, 100, 200, 0.15);
            display: flex;
            gap: 2vw;
            flex-direction: row;
        }
        
        .control-right {
            right: 0;
            background: rgba(200, 0, 0, 0.15);
            display: flex;
            gap: 2vw;
            flex-direction: column;
        }
        
        .control-btn {
            width: 8vw;
            height: 8vw;
            max-width: 60px;
            max-height: 60px;
            min-width: 40px;
            min-height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            background: rgba(100, 150, 255, 0.4);
            color: white;
            font-weight: bold;
            font-size: clamp(14px, 3vw, 18px);
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: pointer;
            transition: all 0.1s;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        .control-btn:active {
            background: rgba(100, 150, 255, 0.8);
            transform: scale(0.95);
        }
        
        .control-right .control-btn {
            background: rgba(255, 100, 100, 0.4);
        }
        
        .control-right .control-btn:active {
            background: rgba(255, 100, 100, 0.8);
        }
        
        /* Desktop only */
        @media (min-width: 1025px) {
            #mobileControls {
                display: none !important;
            }
        }
        
        /* Tablets (iPad, etc) */
        @media (max-width: 1024px) and (min-width: 600px) {
            #mobileControls {
                display: flex !important;
            }
            
            body {
                padding: 0;
                gap: 0;
            }
            
            #gameContainer {
                width: 100vw;
                max-height: 75vh;
            }
        }
        
        /* Mobile phones - maximize game */
        @media (max-width: 599px) {
            #mobileControls {
                display: flex !important;
            }
            
            body {
                padding: 0;
                gap: 0;
            }
            
            #gameContainer {
                width: 100vw;
                max-height: 100vh;
                height: 100vh;
                max-width: 100vw;
            }
        }
        
        /* Bottom Image Display - REMOVED */
        
        #bottomImage {
            display: none;
        }
        
        /* Sponsor Banner */
        #sponsorContainer {
            display: none;
        }
        
        #sponsorText {
            display: none;
        }
        
        /* Desktop only */
        @media (min-width: 1025px) {
            #mobileControls {
                display: none !important;
            }
            
            #bottomImageContainer {
                display: block;
            }
        }
        
        /* Tablets (iPad, etc) */
        @media (max-width: 1024px) and (min-width: 600px) {
            #mobileControls {
                display: flex !important;
            }
            
            body {
                padding: 0;
                gap: 0;
            }
            
            #gameContainer {
                width: 100vw;
                max-height: 75vh;
            }
            
            #bottomImageContainer {
                display: block;
                max-height: 15vh;
                margin-top: 5px;
            }
            
            #bottomImage {
                max-width: 30% !important;
                max-height: 12vh;
            }
        }
        
        /* Mobile phones - hide image, maximize game */
        @media (max-width: 599px) {
            #mobileControls {
                display: flex !important;
            }
            
            body {
                padding: 0;
                gap: 0;
            }
            
            #gameContainer {
                width: 100vw;
                max-height: 100vh;
                height: 100vh;
                max-width: 100vw;
            }
            
            #bottomImageContainer {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1200" height="600"></canvas>
        <div id="mobileControls">
            <div class="control-side control-left">
                <button class="control-btn" id="btnLeft">◀</button>
                <button class="control-btn" id="btnRight">▶</button>
            </div>
            <div class="control-side control-right">
                <button class="control-btn" id="btnJump">↑ JUMP</button>
                <button class="control-btn" id="btnAction">⚡ ACT</button>
            </div>
        </div>
    </div>
    
    <div id="sponsorContainer">
        <p id="sponsorText">🏛️ SPONSORED BY HELLAS ULTRAS 🏛️</p>
    </div>
    
    <script>
        // Register Service Worker for offline support on all devices
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:application/javascript,' + encodeURIComponent(`
                const CACHE_NAME = 'mick-game-v1';
                const urlsToCache = [
                    '/',
                    '/index.html',
                    '/game.js',
                    '/manifest.json'
                ];
                
                self.addEventListener('install', event => {
                    event.waitUntil(
                        caches.open(CACHE_NAME).then(cache => {
                            return cache.addAll(urlsToCache).catch(() => {});
                        })
                    );
                });
                
                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request).then(response => {
                            return response || fetch(event.request).catch(() => {
                                return caches.match('/index.html');
                            });
                        })
                    );
                });
            `)).catch(() => {});
        }
    </script>
    
    <script src="game.js"></script>
</body>
</html>
